name: 🗄️ Veritabanı Yedekleme

on:
  schedule:
    - cron: '0 1 * * *'   # Her gece 01:00 UTC (04:00 Türkiye saati)
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Yedekleme türü (boş bırakılırsa otomatik belirlenir)'
        required: false
        default: 'manuel'
        type: choice
        options: [manuel, gunluk, haftalik, aylik]

jobs:
  backup:
    name: DB Yedekle & Drive Yükle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 PostgreSQL istemcisini yükle
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: 📦 Python bağımlılıklarını yükle
        run: pip install --quiet google-auth google-auth-httplib2 google-api-python-client

      # ---------------------------------------------------------------
      # Yedek türünü belirle:
      #   Ayın 1'i          → aylik
      #   Pazar günü (u=7)  → haftalik
      #   Diğer günler      → gunluk
      #   Manuel tetikleme  → seçilen değer
      # ---------------------------------------------------------------
      - name: 🗜️ Veritabanı yedeği al
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DAY=$(date +%d)
          DOW=$(date +%u)   # 1=Pzt … 7=Paz

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.backup_type }}" != "manuel" ]; then
            BACKUP_TYPE="${{ github.event.inputs.backup_type }}"
          elif [ "$DAY" = "01" ]; then
            BACKUP_TYPE="aylik"
          elif [ "$DOW" = "7" ]; then
            BACKUP_TYPE="haftalik"
          else
            BACKUP_TYPE="gunluk"
          fi

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="hmtrms_${BACKUP_TYPE}_${TIMESTAMP}.sql.gz"

          pg_dump --no-acl --no-owner "$SUPABASE_DB_URL" | gzip > "${FILENAME}"

          SIZE=$(du -sh "${FILENAME}" | cut -f1)
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "backup_type=${BACKUP_TYPE}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "✅ Yedek alındı: ${FILENAME} (${SIZE})"

      # ---------------------------------------------------------------
      # Saklama politikası:
      #   Günlük   → 7 gün
      #   Haftalık → 28 gün
      #   Aylık    → 365 gün
      #   Manuel   → 30 gün
      # ---------------------------------------------------------------
      - name: ☁️ Google Drive'a yükle & eski yedekleri temizle
        env:
          GDRIVE_SA_CREDENTIALS: ${{ secrets.GDRIVE_SA_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FILENAME: ${{ steps.dump.outputs.filename }}
          BACKUP_TYPE: ${{ steps.dump.outputs.backup_type }}
        run: |
          python3 - <<'PYEOF'
          import os, json
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2 import service_account
          from datetime import datetime, timezone, timedelta

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ['GDRIVE_SA_CREDENTIALS']),
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          filename    = os.environ['FILENAME']
          backup_type = os.environ['BACKUP_TYPE']
          root_id     = os.environ['GDRIVE_FOLDER_ID']

          subfolder_names = {
              'gunluk': 'Günlük', 'haftalik': 'Haftalık',
              'aylik': 'Aylık',   'manuel': 'Manuel'
          }
          retention_days = {'gunluk': 7, 'haftalik': 28, 'aylik': 365, 'manuel': 30}

          subfolder_name = subfolder_names.get(backup_type, 'Manuel')
          retention      = retention_days.get(backup_type, 30)

          # Alt klasörü bul ya da oluştur
          q = (
              f"name='{subfolder_name}' and '{root_id}' in parents"
              f" and mimeType='application/vnd.google-apps.folder' and trashed=false"
          )
          folders = service.files().list(q=q, fields='files(id)').execute().get('files', [])
          if folders:
              folder_id = folders[0]['id']
          else:
              meta = {
                  'name': subfolder_name,
                  'mimeType': 'application/vnd.google-apps.folder',
                  'parents': [root_id]
              }
              folder_id = service.files().create(body=meta, fields='id').execute()['id']
              print(f"📁 Klasör oluşturuldu: HMTRMS Yedekler/{subfolder_name}/")

          # Yedek dosyasını yükle
          media = MediaFileUpload(filename, mimetype='application/gzip', resumable=True)
          uploaded = service.files().create(
              body={'name': filename, 'parents': [folder_id]},
              media_body=media,
              fields='id,size'
          ).execute()
          print(f"✅ Yüklendi: {filename}  ({int(uploaded.get('size', 0)) // 1024} KB)")

          # Saklama politikasına göre eski yedekleri temizle
          cutoff = (datetime.now(timezone.utc) - timedelta(days=retention)).isoformat()
          old_files = service.files().list(
              q=f"'{folder_id}' in parents and createdTime < '{cutoff}' and trashed=false",
              fields='files(id,name,createdTime)'
          ).execute().get('files', [])

          for f in old_files:
              service.files().delete(fileId=f['id']).execute()
              print(f"🗑️  Silindi: {f['name']}  (oluşturulma: {f['createdTime'][:10]})")

          if not old_files:
              print(f"ℹ️  Temizlenecek eski yedek yok (saklama politikası: {retention} gün)")
          PYEOF

      - name: 📊 Özet
        if: always()
        run: |
          echo "## 🗄️ Yedekleme Sonucu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Alan | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tür**    | ${{ steps.dump.outputs.backup_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dosya**  | ${{ steps.dump.outputs.filename }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Boyut**  | ${{ steps.dump.outputs.size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Zaman**  | $(date +'%d.%m.%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
